<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Create Account</h2>
    
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
        <input type="text" name="name" [(ngModel)]="formData.name" required
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
          placeholder="e.g. Rahul Roy">
      </div>

      <div class="mb-4">
        <!-- 🔥 IMPORTANT: Yahan wahi email daalna jo MacroDroid me set kiya hai! -->
        <label class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
        <input type="email" name="email" [(ngModel)]="formData.email" required
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
          placeholder="Enter your email">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <input type="password" name="password" [(ngModel)]="formData.password" required minlength="6"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
          placeholder="At least 6 characters">
      </div>

      <div class="flex items-center justify-between mb-4">
        <button type="submit" [disabled]="isLoading"
          class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full disabled:opacity-50">
          {{ isLoading ? 'Creating account...' : 'Register' }}
        </button>
      </div>
      
      <div class="text-center mt-4">
        <span class="text-gray-600 text-sm">Already have an account? </span>
        <a routerLink="/login" class="text-blue-600 hover:text-blue-800 text-sm font-bold cursor-pointer">Login here</a>
      </div>
    </form>
  </div>
</div>
